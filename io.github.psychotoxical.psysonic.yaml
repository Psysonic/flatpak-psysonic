app-id: io.github.psychotoxical.psysonic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
separate-locales: false

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  - --talk-name=com.canonical.AppIndicator
  # media player controls
  - --own-name=org.mpris.MediaPlayer2.chromium.*

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: psysonic
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node26/bin
      env:
        npm_config_nodedir: /usr/lib/sdk/node26
        XDG_CACHE_HOME: /run/build/psysonic/flatpak-node/cache
        electron_config_cache: /run/build/psysonic/flatpak-node/cache/electron
        ELECTRON_CACHE: /run/build/psysonic/flatpak-node/cache/electron
        npm_config_cache: /run/build/psysonic/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - rm -f pnpm-lock.yaml
      - rm -rf node_modules
      - rm -f package-lock.json

      - yarn cache clean --offline
      - ELECTRON_SKIP_BINARY_DOWNLOAD=1 CYPRESS_INSTALL_BINARY=0 yarn --offline
      - yarn run tauri:build
      - |
        . ./flatpak-node/electron-builder-arch-args.sh
        yarn run build:linux $ELECTRON_BUILDER_ARCH_ARGS --dir
      - cp -a dist/linux*unpacked /app/main
      - chmod +x /app/main/psysonic

      - install -Dm755 -t /app/bin/ psysonic.sh
      - install -Dm644 ${FLATPAK_ID}.desktop      /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 32x32.png                  /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 128x128.png                /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png

    sources:
      - type: git
        url: https://github.com/Psychotoxical/psysonic.git
        commit: 2d4cb95f7f932aa3ac91b8238f966363ca9eb8d6

      - type: file
        path: icons/32x32.png

      - type: file
        path: icons/128x128.png

      - type: file
        path: io.github.psychotoxical.psysonic.metainfo.xml

      - type: file
        path: io.github.psychotoxical.psysonic.desktop

      - type: inline
        dest-filename: .yarnrc
        contents: |
          yarn-offline-mirror "/run/build/psysonic/flatpak-node/yarn-mirror"
          cache-folder "/run/downloads"
          prefix "/run/downloads"
          --install.offline true
          --run.offline true

      - yarn-sources.json

      - cargo-sources.json

      - type: file
        path: yarn.lock

      - type: script
        dest-filename: psysonic.sh
        commands:
          - zypak-wrapper /app/main/psysonic "$@"
