app-id: io.github.psysonic.psysonic
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

separate-locales: false
command: psysonic

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  # Network: Subsonic server, Last.fm, Discord RPC, LRCLIB, Bandsintown
  - --share=network
  - --share=ipc
  # Display: prefer Wayland, fall back to X11
  - --socket=wayland
  - --socket=fallback-x11
  # On pure-Wayland sessions the X11 socket is absent; tell GDK to try
  # Wayland first so GTK doesn't panic when XDG_SESSION_TYPE=wayland.
  - --env=GDK_BACKEND=wayland,x11
  # Audio output
  - --socket=pulseaudio
  # Desktop media controls
  - --own-name=org.mpris.MediaPlayer2.psysonic
  # Discord RPC unix socket lives in $XDG_RUNTIME_DIR
  - --filesystem=xdg-run/discord-ipc-0:ro
  - --filesystem=xdg-run/discord-ipc-1:ro
  - --filesystem=xdg-run/discord-ipc-2:ro
  - --filesystem=xdg-run/discord-ipc-3:ro
  - --filesystem=xdg-run/discord-ipc-4:ro
  # Tray icon (GNOME needs AppIndicator extension installed)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  - --talk-name=com.canonical.AppIndicator

build-options:
  append-path: /usr/lib/sdk/node26/bin:/usr/lib/sdk/rust-stable/bin
  env:
    - CARGO_HOME=/run/build/psysonic/cargo
    - CARGO_NET_OFFLINE=true
    - RUSTUP_TOOLCHAIN=stable

modules:

  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: psysonic
    buildsystem: simple
    license-files:
      - LICENSE
    build-options:
      append-path: /usr/lib/sdk/node26/bin:/usr/lib/sdk/rust-stable/bin
      env:
        - PKG_CONFIG_PATH=/app/lib/pkgconfig:/app/share/pkgconfig
        # Keep release notices, but do not offer incompatible Linux packages
        - VITE_PSYSONIC_FLATPAK=1
        # Prevents tauri-build from checking whether the Vite dev server is running
        - TAURI_SKIP_DEVSERVER_CHECK=true
        # npm offline cache — flatpak-node-generator places sources in flatpak-node/npm-cache
        - npm_config_cache=/run/build/psysonic/flatpak-node/npm-cache
        - npm_config_offline=true
        - XDG_CACHE_HOME=/run/build/psysonic/flatpak-node/cache
    build-commands:
      # Install npm dependencies from pre-generated offline sources
      - npm ci --offline
      - npm run tauri build -- --no-bundle

      # Install binary and assets
      - install -Dm755 src-tauri/target/release/psysonic "${FLATPAK_DEST}/bin/psysonic"

      - install -Dm644 ${FLATPAK_ID}.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"

      - install -Dm644 src-tauri/icons/32x32.png "${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png"
      - install -Dm644 src-tauri/icons/128x128.png "${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png"
      - install -Dm644 src-tauri/icons/128x128@2x.png "${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png"
      - install -Dm644 src-tauri/icons/icon.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"

    sources:
      - type: git
        url: https://github.com/Psysonic/psysonic.git
        commit: ae26555fa0528d3cfa7fd57047ab5740943903d4

      - type: file
        path: io.github.psysonic.psysonic.metainfo.xml

      - type: file
        path: io.github.psysonic.psysonic.desktop

      - generated-sources.json

      - cargo-sources.json
